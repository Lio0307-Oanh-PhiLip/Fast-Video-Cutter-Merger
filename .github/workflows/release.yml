name: Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Script Compilation
        run: |
          python3 -m py_compile fast_video_editor.py
          python3 -m py_compile setup_wizard.py

      - name: Create Release Packages
        run: |
          mkdir -p release_dist
          cp fast_video_editor.py release_dist/
          cp setup_wizard.py release_dist/
          cp run_windows.bat release_dist/
          cp run_linux.sh release_dist/
          cp installer_windows.iss release_dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fast_video_editor.py
            setup_wizard.py
            run_windows.bat
            run_linux.sh
            installer_windows.iss
          draft: false
          prerelease: false
          generate_release_notes: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.7"/>

  <!-- Film Reel Ring & Spindles -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="18" opacity="0.9"/>
    <circle cx="256" cy="256" r="65" fill="#0f172a" stroke="url(#accent)" stroke-width="12"/>
    
    <!-- Reel Sprocket Holes -->
    <circle cx="256" cy="150" r="20" fill="#0284c7" opacity="0.8"/>
    <circle cx="256" cy="362" r="20" fill="#0284c7" opacity="0.8"/>
    <circle cx="150" cy="256" r="20" fill="#0284c7" opacity="0.8"/>
    <circle cx="362" cy="256" r="20" fill="#0284c7" opacity="0.8"/>
    
    <circle cx="181" cy="181" r="16" fill="#0ea5e9" opacity="0.6"/>
    <circle cx="331" cy="181" r="16" fill="#0ea5e9" opacity="0.6"/>
    <circle cx="181" cy="331" r="16" fill="#0ea5e9" opacity="0.6"/>
    <circle cx="331" cy="331" r="16" fill="#0ea5e9" opacity="0.6"/>
  </g>

  <!-- Film Strip Accent Marks -->
  <rect x="80" y="240" width="28" height="32" rx="6" fill="#38bdf8" opacity="0.8"/>
  <rect x="404" y="240" width="28" height="32" rx="6" fill="#38bdf8" opacity="0.8"/>

  <!-- High-Speed Lightning Bolt (Scissors / Cut & Speed Fusion) -->
  <polygon points="285,110 185,265 245,265 215,405 335,235 270,235" fill="url(#bolt)" filter="url(#glow)"/>

  <!-- Play / Precision Triangle Pointer -->
  <polygon points="240,225 285,256 240,287" fill="#ffffff" opacity="0.95"/>
</svg>